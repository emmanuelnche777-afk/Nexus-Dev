<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-trendora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081c"/>
      <stop offset="50%" stop-color="#0f123f"/>
      <stop offset="100%" stop-color="#1a1d52"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45afe1"/>
      <stop offset="100%" stop-color="#5cdefe"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="1200" height="800" fill="url(#bg-trendora)"/>
  
  <!-- Subtle Background Grid -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200 M 0 600 H 1200 M 0 700 H 1200" stroke="#45afe1" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M 100 0 V 800 M 200 0 V 800 M 300 0 V 800 M 400 0 V 800 M 500 0 V 800 M 600 0 V 800 M 700 0 V 800 M 800 0 V 800 M 900 0 V 800 M 1000 0 V 800 M 1100 0 V 800" stroke="#45afe1" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Desktop Browser Window Frame -->
  <g filter="url(#card-shadow)">
    <rect x="80" y="60" width="1040" height="680" rx="16" fill="#0b0e2d" stroke="#45afe1" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#141843"/>
    <circle cx="112" cy="84" r="6" fill="#ef4444"/>
    <circle cx="132" cy="84" r="6" fill="#eab308"/>
    <circle cx="152" cy="84" r="6" fill="#22c55e"/>
    
    <!-- URL Field -->
    <rect x="200" y="70" width="640" height="28" rx="8" fill="#05081c" stroke="#45afe1" stroke-opacity="0.2"/>
    <text x="220" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5cdefe" font-weight="500">🔒 https://trendora.nexus.cm/storefront</text>

    <!-- App Navbar -->
    <rect x="80" y="108" width="1040" height="64" fill="#0f123f" stroke-bottom="#1a1d52"/>
    <text x="120" y="147" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="1">TRENDORA<tspan fill="#5cdefe">.</tspan></text>

    <!-- Nav Items -->
    <text x="320" y="146" font-family="system-ui, sans-serif" font-size="13" fill="#5cdefe" font-weight="600">Categories</text>
    <text x="430" y="146" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" opacity="0.7">Deals</text>
    <text x="500" y="146" font-family="sans-serif" font-size="13" fill="#ffffff" opacity="0.7">Vendors</text>
    <text x="590" y="146" font-family="sans-serif" font-size="13" fill="#ffffff" opacity="0.7">Orders</text>

    <!-- Cart Button & User Avatar -->
    <rect x="940" y="124" width="140" height="34" rx="8" fill="url(#primary-glow)"/>
    <text x="965" y="146" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0f123f">🛒 Cart (3)</text>

    <!-- Hero Showcase Section -->
    <rect x="110" y="192" width="980" height="210" rx="12" fill="#151949"/>
    <rect x="140" y="222" width="180" height="26" rx="13" fill="#45afe1" fill-opacity="0.15" stroke="#45afe1" stroke-opacity="0.3"/>
    <text x="155" y="239" font-family="monospace" font-size="11" fill="#5cdefe" font-weight="bold">NEW ARRIVALS 2026</text>
    
    <text x="140" y="290" font-family="system-ui, sans-serif" font-weight="800" font-size="32" fill="#ffffff">Premium Tech &amp; Urban Fashion</text>
    <text x="140" y="320" font-family="system-ui, sans-serif" font-size="14" fill="#f4f6fb" opacity="0.7">Streamlined Multi-Vendor Marketplace with Instant Mobile Money Checkout</text>

    <rect x="140" y="340" width="150" height="40" rx="8" fill="url(#primary-glow)"/>
    <text x="175" y="365" font-family="sans-serif" font-weight="bold" font-size="13" fill="#0f123f">Explore Store →</text>

    <!-- Product Grid Mockup -->
    <!-- Card 1 -->
    <rect x="110" y="425" width="225" height="290" rx="12" fill="#141843" stroke="#45afe1" stroke-opacity="0.2"/>
    <rect x="125" y="440" width="195" height="150" rx="8" fill="#0a0d28"/>
    <circle cx="222" cy="515" r="35" fill="#45afe1" fill-opacity="0.2"/>
    <text x="125" y="612" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Wireless Earbuds Pro</text>
    <text x="125" y="635" font-family="monospace" font-size="13" fill="#5cdefe" font-weight="bold">28,500 XAF</text>
    <rect x="125" y="655" width="195" height="34" rx="6" fill="#45afe1" fill-opacity="0.15" stroke="#45afe1" stroke-opacity="0.4"/>
    <text x="175" y="676" font-family="sans-serif" font-size="12" fill="#5cdefe" font-weight="bold">Add to Cart</text>

    <!-- Card 2 -->
    <rect x="360" y="425" width="225" height="290" rx="12" fill="#141843" stroke="#45afe1" stroke-opacity="0.2"/>
    <rect x="375" y="440" width="195" height="150" rx="8" fill="#0a0d28"/>
    <circle cx="472" cy="515" r="35" fill="#5cdefe" fill-opacity="0.2"/>
    <text x="375" y="612" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Smart Watch Series 5</text>
    <text x="375" y="635" font-family="monospace" font-size="13" fill="#5cdefe" font-weight="bold">45,000 XAF</text>
    <rect x="375" y="655" width="195" height="34" rx="6" fill="#45afe1" fill-opacity="0.15" stroke="#45afe1" stroke-opacity="0.4"/>
    <text x="425" y="676" font-family="sans-serif" font-size="12" fill="#5cdefe" font-weight="bold">Add to Cart</text>

    <!-- Card 3 -->
    <rect x="610" y="425" width="225" height="290" rx="12" fill="#141843" stroke="#45afe1" stroke-opacity="0.2"/>
    <rect x="625" y="440" width="195" height="150" rx="8" fill="#0a0d28"/>
    <circle cx="722" cy="515" r="35" fill="#45afe1" fill-opacity="0.2"/>
    <text x="625" y="612" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Minimalist Backpack</text>
    <text x="625" y="635" font-family="monospace" font-size="13" fill="#5cdefe" font-weight="bold">19,000 XAF</text>
    <rect x="625" y="655" width="195" height="34" rx="6" fill="#45afe1" fill-opacity="0.15" stroke="#45afe1" stroke-opacity="0.4"/>
    <text x="675" y="676" font-family="sans-serif" font-size="12" fill="#5cdefe" font-weight="bold">Add to Cart</text>

    <!-- Mobile Screen Frame Overlay on Right Side -->
    <g filter="url(#card-shadow)" transform="translate(865, 360)">
      <rect x="0" y="0" width="180" height="350" rx="24" fill="#05081c" stroke="#5cdefe" stroke-width="2"/>
      <rect x="60" y="10" width="60" height="12" rx="6" fill="#141843"/>
      <!-- Mobile content -->
      <rect x="15" y="35" width="150" height="35" rx="6" fill="#141843"/>
      <text x="25" y="57" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Mobile Checkout</text>
      
      <rect x="15" y="80" width="150" height="180" rx="8" fill="#141843"/>
      <text x="25" y="105" font-family="sans-serif" font-size="10" fill="#5cdefe">MTN MoMo / Orange</text>
      <rect x="25" y="120" width="130" height="25" rx="4" fill="#0a0d28" stroke="#45afe1" stroke-opacity="0.4"/>
      <text x="35" y="136" font-family="monospace" font-size="9" fill="#ffffff">690 XXX XXX</text>
      
      <rect x="25" y="160" width="130" height="30" rx="6" fill="url(#primary-glow)"/>
      <text x="45" y="180" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f123f">Pay 28,500 XAF</text>
    </g>
  </g>
</svg>