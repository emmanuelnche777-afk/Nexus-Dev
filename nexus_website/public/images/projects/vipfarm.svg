<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-vip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04121a"/>
      <stop offset="50%" stop-color="#0a2233"/>
      <stop offset="100%" stop-color="#0f344d"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#45afe1"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-vip)"/>
  
  <!-- Grid Lines -->
  <path d="M 0 100 H 1200 M 0 200 H 1200 M 0 300 H 1200 M 0 400 H 1200 M 0 500 H 1200 M 0 600 H 1200 M 0 700 H 1200" stroke="#00F0FF" stroke-opacity="0.05" stroke-width="1"/>
  <path d="M 100 0 V 800 M 200 0 V 800 M 300 0 V 800 M 400 0 V 800 M 500 0 V 800 M 600 0 V 800 M 700 0 V 800 M 800 0 V 800 M 900 0 V 800 M 1000 0 V 800 M 1100 0 V 800" stroke="#00F0FF" stroke-opacity="0.05" stroke-width="1"/>

  <g filter="url(#card-shadow)">
    <!-- Browser Window -->
    <rect x="80" y="60" width="1040" height="680" rx="16" fill="#061624" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Header Bar -->
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#0b2438"/>
    <circle cx="112" cy="84" r="6" fill="#ef4444"/>
    <circle cx="132" cy="84" r="6" fill="#eab308"/>
    <circle cx="99" cy="84" r="6" fill="#22c55e"/>
    
    <rect x="200" y="70" width="640" height="28" rx="8" fill="#04121a" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="220" y="89" font-family="sans-serif" font-size="12" fill="#00F0FF" font-weight="500">🔒 https://vipfarm.nexus.cm/dashboard/poultry-analytics</text>

    <!-- Sidebar & Top Bar -->
    <rect x="80" y="108" width="220" height="632" fill="#061624" stroke-right="#0b2438"/>
    <text x="110" y="152" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff">VIP FARM<tspan fill="#00F0FF">.</tspan></text>
    
    <!-- Sidebar Menu Items -->
    <rect x="95" y="180" width="190" height="38" rx="8" fill="#00F0FF" fill-opacity="0.15"/>
    <text x="130" y="204" font-family="sans-serif" font-size="13" fill="#00F0FF" font-weight="bold">📊 Dashboard</text>
    <text x="130" y="254" font-family="sans-serif" font-size="13" fill="#ffffff" opacity="0.7">🐔 Livestock</text>
    <text x="130" y="304" font-family="sans-serif" font-size="13" fill="#ffffff" opacity="0.7">🌾 Feed Inventory</text>
    <text x="130" y="354" font-family="sans-serif" font-size="13" fill="#ffffff" opacity="0.7">🩺 Health Monitor</text>
    <text x="130" y="404" font-family="sans-serif" font-size="13" fill="#ffffff" opacity="0.7">📈 Egg Production</text>

    <!-- Main Content Header -->
    <rect x="300" y="108" width="820" height="64" fill="#081d2e"/>
    <text x="330" y="146" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff">Poultry Farm Live Operations &amp; Analytics</text>
    <rect x="940" y="123" width="150" height="34" rx="8" fill="url(#cyan-glow)"/>
    <text x="965" y="145" font-family="sans-serif" font-weight="bold" font-size="12" fill="#04121a">+ Export Report</text>

    <!-- Metrics Cards Row -->
    <rect x="330" y="195" width="235" height="110" rx="12" fill="#0b2438" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="355" y="225" font-family="sans-serif" font-size="12" fill="#00F0FF">Total Flock Count</text>
    <text x="355" y="265" font-family="sans-serif" font-weight="extrabold" font-size="28" fill="#ffffff">18,450 <tspan font-size="14" fill="#22c55e">↑ +5%</tspan></text>
    <text x="355" y="285" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Broilers &amp; Layers</text>

    <rect x="590" y="195" width="235" height="110" rx="12" fill="#0b2438" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="615" y="225" font-family="sans-serif" font-size="12" fill="#00F0FF">Daily Egg Output</text>
    <text x="615" y="265" font-family="sans-serif" font-weight="extrabold" font-size="28" fill="#ffffff">14,280 <tspan font-size="14" fill="#22c55e">↑ 98.4%</tspan></text>
    <text x="615" y="285" font-family="sans-serif" font-size="11" fill="#ffffff" opacity="0.5">Crate conversion high</text>

    <rect x="850" y="195" width="235" height="110" rx="12" fill="#0b2438" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="875" y="225" font-family="sans-serif" font-size="12" fill="#00F0FF">Feed Inventory Stock</text>
    <text x="875" y="265" font-family="sans-serif" font-weight="extrabold" font-size="28" fill="#5cdefe">12.4 Tons</text>
    <text x="875" y="285" font-family="sans-serif" font-size="11" fill="#22c55e">Optimal levels for 24 days</text>

    <!-- Large Analytics Chart Area -->
    <rect x="330" y="330" width="755" height="380" rx="12" fill="#0b2438" stroke="#00F0FF" stroke-opacity="0.2"/>
    <text x="360" y="365" font-family="sans-serif" font-weight="bold" font-size="15" fill="#ffffff">Weekly Egg Production &amp; Feed Intake Trend</text>
    
    <!-- Graph Simulation Lines -->
    <path d="M 380 620 C 450 550, 520 580, 600 480 C 680 380, 750 500, 830 420 C 910 340, 980 410, 1050 370" fill="none" stroke="#00F0FF" stroke-width="3"/>
    <path d="M 380 640 C 450 600, 520 610, 600 540 C 680 470, 750 560, 830 490 C 910 420, 980 470, 1050 430" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Data Nodes -->
    <circle cx="600" cy="480" r="5" fill="#00F0FF"/>
    <circle cx="830" cy="420" r="5" fill="#00F0FF"/>
    <circle cx="1050" cy="370" r="6" fill="#ffffff" stroke="#00F0FF" stroke-width="2"/>
  </g>
</svg>