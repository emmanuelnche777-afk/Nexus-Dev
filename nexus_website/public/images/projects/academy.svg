    <!-- Top Nav -->
    <rect x="80" y="108" width="1040" height="64" fill="#0f123f"/>
    <text x="120" y="147" font-family="sans-serif" font-weight="900" font-size="20" fill="#ffffff">NEXUS ACADEMY<tspan fill="#5cdefe"> PORTAL</tspan></text>
    <rect x="940" y="123" width="140" height="34" rx="8" fill="url(#purple-glow)"/>
    <text x="965" y="145" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0f123f">Verify Cert →</text>

    <!-- Dashboard Hero Area -->
    <rect x="120" y="195" width="620" height="210" rx="12" fill="#171b54" stroke="#45afe1" stroke-opacity="0.2"/>
    <text x="150" y="235" font-family="sans-serif" font-weight="extrabold" font-size="24" fill="#ffffff">Student Learning &amp; Verification Hub</text>
    <text x="150" y="265" font-family="sans-serif" font-size="14" fill="#f4f6fb" opacity="0.7">Software Development Cohort 1 · Reg ID: NX-AC-2026-084</text>
    
    <!-- Progress Bar -->
    <rect x="150" y="295" width="560" height="12" rx="6" fill="#0c0e33"/>
    <rect x="150" y="295" width="460" height="12" rx="6" fill="url(#purple-glow)"/>
    <text x="150" y="330" font-family="monospace" font-size="12" fill="#5cdefe">Curriculum Progress: 82% Completed (10/12 Modules)</text>

    <!-- Certificate Card Mockup Right Side -->
    <rect x="770" y="195" width="310" height="505" rx="12" fill="#171b54" stroke="#5cdefe" stroke-opacity="0.4"/>
    <rect x="790" y="215" width="270" height="160" rx="8" fill="#0c0e33" stroke="#5cdefe" stroke-opacity="0.3"/>
    <text x="810" y="250" font-family="serif" font-weight="bold" font-size="16" fill="#ffffff">CERTIFICATE</text>
    <text x="810" y="270" font-family="sans-serif" font-size="11" fill="#45afe1">OF COMPLETION</text>
    <text x="810" y="310" font-family="sans-serif" font-weight="bold" font-size="14" fill="#5cdefe">Verified Student</text>
    <text x="810" y="330" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.6">ID: NX-AC-2026-084</text>

    <rect x="790" y="395" width="270" height="285" rx="8" fill="#0c0e33"/>
    <text x="810" y="425" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff">Verification Portal</text>
    <rect x="810" y="445" width="230" height="34" rx="6" fill="#171b54" stroke="#45afe1" stroke-opacity="0.3"/>
    <text x="825" y="466" font-family="monospace" font-size="11" fill="#ffffff">NX-AC-2026-084</text>
    <rect x="810" y="495" width="230" height="38" rx="6" fill="url(#purple-glow)"/>
    <text x="870" y="519" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0f123f">Verify Now ✓</text>
