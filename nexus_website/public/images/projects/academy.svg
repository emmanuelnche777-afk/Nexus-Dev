<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-academy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f123f"/>
      <stop offset="50%" stop-color="#1e1845"/>
      <stop offset="100%" stop-color="#2e3192"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5cdefe"/>
      <stop offset="100%" stop-color="#45afe1"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg-academy)"/>
  
  <g filter="url(#card-shadow)">
    <rect x="80" y="60" width="1040" height="680" rx="16" fill="#0c0e33" stroke="#45afe1" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <rect x="80" y="60" width="1040" height="48" rx="16" fill="#141848"/>
    <circle cx="112" cy="84" r="6" fill="#ef4444"/>
    <circle cx="132" cy="84" r="6" fill="#eab308"/>
    <circle cx="99" cy="84" r="6" fill="#22c55e"/>
    
    <rect x="200" y="70" width="640" height="28" rx="8" fill="#0c0e33" stroke="#45afe1" stroke-opacity="0.2"/>
