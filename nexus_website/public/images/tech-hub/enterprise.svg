<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg-enterprise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101A"/>
      <stop offset="50%" stop-color="#0A2239"/>
      <stop offset="100%" stop-color="#123B5C"/>
    </linearGradient>
    <linearGradient id="cyan-blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid-enterprise" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F0FF" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
    <filter id="glow-enterprise">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg-enterprise)"/>
  <rect width="800" height="400" fill="url(#grid-enterprise)"/>

  <!-- Glowing Aura -->
  <circle cx="400" cy="200" r="150" fill="#00F0FF" fill-opacity="0.06" filter="url(#glow-enterprise)"/>

  <!-- Enterprise Network & Server Infrastructure -->
  <g transform="translate(400, 190)">
    <!-- Central Enterprise Hub Building & Servers -->
    <rect x="-60" y="-80" width="120" height="160" rx="8" fill="#0A2239" stroke="url(#cyan-blue-glow)" stroke-width="2.5" filter="url(#glow-enterprise)"/>
    
    <!-- Server Stack Slots -->
    <line x1="-45" y1="-50" x2="45" y2="-50" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="-45" y1="-20" x2="45" y2="-20" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="-45" y1="10" x2="45" y2="10" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 4"/>
    <line x1="-45" y1="40" x2="45" y2="40" stroke="#00F0FF" stroke-width="2" stroke-dasharray="8 4"/>
    
    <!-- Status Indicator LEDs -->
    <circle cx="-35" cy="-50" r="3" fill="#00F0FF" filter="url(#glow-enterprise)"/>
    <circle cx="-35" cy="-20" r="3" fill="#00F0FF" filter="url(#glow-enterprise)"/>
    <circle cx="-35" cy="10" r="3" fill="#00F0FF" filter="url(#glow-enterprise)"/>
    <circle cx="-35" cy="40" r="3" fill="#00F0FF" filter="url(#glow-enterprise)"/>

    <!-- Left & Right Subsidiary Nodes -->
    <rect x="-170" y="-40" width="60" height="80" rx="6" fill="#05101A" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>
    <rect x="110" y="-40" width="60" height="80" rx="6" fill="#05101A" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Connecting Data Cables -->
    <path d="M -110 0 L -60 0" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 3" filter="url(#glow-enterprise)"/>
    <path d="M 60 0 L 110 0" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4 3" filter="url(#glow-enterprise)"/>
  </g>

  <!-- Tagline Badge -->
  <rect x="50" y="40" width="230" height="32" rx="16" fill="#0A2239" stroke="#00F0FF" stroke-opacity="0.5"/>
  <text x="165" y="61" font-family="monospace" font-size="12" fill="#00F0FF" text-anchor="middle" font-weight="bold">ENTERPRISE &amp; INSTITUTIONS</text>
</svg>